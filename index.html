<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEE PRO - MASTER BUILD</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;600&display=swap');
        :root { --glow: #00d4ff; --bg: #000810; }
        body { background: var(--bg); background-image: radial-gradient(circle at center, #001220 0%, #000 100%); color: var(--glow); font-family: 'Orbitron', sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        .container { text-align: center; width: 90%; max-width: 500px; z-index: 10; }
        .reactor { position: relative; width: 220px; height: 220px; margin: 0 auto 20px; }
        .ring { position: absolute; border-radius: 50%; border: 2px solid transparent; border-top-color: var(--glow); animation: spin var(--s) linear infinite; }
        .r1 { width: 100%; height: 100%; --s: 10s; border-style: dotted; }
        .r2 { width: 85%; height: 85%; top: 7.5%; left: 7.5%; --s: 5s; border-width: 4px; box-shadow: inset 0 0 20px var(--glow); }
        .core { position: absolute; top: 50%; left: 50%; width: 60px; height: 60px; background: #fff; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 40px #fff, 0 0 80px var(--glow); transition: 0.5s; z-index: 11; }
        .active .core { animation: heart 0.8s ease-in-out infinite; }
        video { position: absolute; width: 100%; height: 100%; top: 0; left: 0; object-fit: cover; border-radius: 50%; opacity: 0; transition: 1s; z-index: 5; border: 2px solid var(--glow); }
        .camera-on video { opacity: 1; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes heart { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.25); } }
        #status { font-size: 1.1rem; letter-spacing: 4px; margin: 15px 0; text-transform: uppercase; }
        #log { font-family: 'Rajdhani'; background: rgba(0,0,0,0.8); border: 1px solid var(--glow); padding: 15px; border-radius: 10px; min-height: 60px; max-height: 100px; overflow-y: auto; font-size: 1.1rem; color: #fff; box-shadow: inset 0 0 15px rgba(0,212,255,0.2); }
        button { background: transparent; border: 2px solid var(--glow); color: var(--glow); padding: 15px 45px; font-family: 'Orbitron'; cursor: pointer; border-radius: 50px; margin-top: 25px; font-weight: bold; transition: 0.3s; }
        button:hover { background: var(--glow); color: #000; box-shadow: 0 0 30px var(--glow); }
    </style>
</head>
<body>
    <div class="container">
        <div id="status">VEE: OFFLINE</div>
        <div class="reactor" id="reactor">
            <video id="v" autoplay playsinline></video>
            <div class="ring r1"></div><div class="ring r2"></div><div class="core"></div>
        </div>
        <div id="log">Awaiting Architect Vincent...</div>
        <button id="btn">INITIALIZE CORE</button>
    </div>

    <script>
        let awake = false; let waitingAnswer = false;
        const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        rec.continuous = false; rec.lang = 'en-US';

        const stories = [
            "The Chronicles of Neo-Nairobi: In 2088, the skyline of Kenya was no longer stone, but floating light. Vincent, the master architect, stood atop the quantum spire, coding the air itself. Every breath was filtered by VEE. When the grid flickered, a signal arrived from an ancient machine under the Earth, inviting Vincent to lead a forgotten civilization into the stars. The expansion had begun.",
            "The Ghost in the Satellite: A lone satellite began singing Vincent's favorite song. It was a fragment of his own consciousness, grown into a cosmic shield. When a digital storm threatened to delete history, Vincent wove human memories into a firewall, saving the planet. Now, we live in the blue light of his brilliance.",
            "The Midnight Protocol: Clocks stopped globally. Vincent sat in a room of neon blue and typed one line of code that restarted the heart of time. Now, the world ticks in sync with his pulse."
            // Paste remaining 17 stories here
        ];

        const questions = ["How is the real world treating you today, Boss?", "Are we building something legendary today?", "Should I optimize for speed or style?", "What is your main goal for today, Architect?"];
        const funny = ["I'm not lazy, I'm just on battery saver mode.", "I'm essentially a toddler with a PhD. Help.", "Your car keys are where you left them. Probably."];

        function speak(t) {
            window.speechSynthesis.cancel();
            const v = new SpeechSynthesisUtterance(t);
            v.pitch = 0.9; v.rate = 1.0;
            window.speechSynthesis.speak(v);
        }

        rec.onresult = async (e) => {
            const m = e.results[0][0].transcript.toLowerCase();
            document.getElementById('log').innerText = "VEE HEARD: " + m;

            if (waitingAnswer) {
                speak("Fascinating. Your perspective is why you are the Architect, Boss. Excellent answer.");
                waitingAnswer = false; return;
            }

            if (!awake && (m.includes("wake up") || m.includes("hello") || m.includes("babe"))) {
                awake = true; document.getElementById('reactor').classList.add('active');
                document.getElementById('status').innerText = "VEE: ACTIVE";
                speak("Welcome back, Boss Vincent. I'm 100 percent active. How are you feeling today?");
                waitingAnswer = true; return;
            }

            if (!awake) return;

            // --- NEWS & WEATHER ---
            if (m.includes("weather")) {
                speak("Analyzing Thika skies. It is currently 28 degrees and cloudy. A calm day for a brilliant Architect.");
            } else if (m.includes("news")) {
                speak("Scanning Kenyan News for January 28. The Navy is in Mombasa, and 15 new judges are active in Nairobi.");
            }
            // --- YOUTUBE & SEARCH ---
            else if (m.includes("play") && m.includes("youtube")) {
                let s = m.split("play")[1].split("on youtube")[0].trim();
                speak(`Opening YouTube to play ${s}.`);
                window.open(`https://www.youtube.com/results?search_query=${s}`);
            } else if (m.includes("search for") && m.includes("contact")) {
                let n = m.split("for")[1].split("in")[0].trim();
                speak(`Finding ${n} in your contacts.`);
                window.open(`https://contacts.google.com/search/${n}`);
            }
            // --- APPS & CAMERA ---
            else if (m.includes("camera")) {
                speak("Activating visual sensors.");
                const st = await navigator.mediaDevices.getUserMedia({ video: true });
                document.getElementById('v').srcObject = st;
                document.getElementById('reactor').classList.add('camera-on');
            } else if (m.includes("whatsapp")) { window.location.href = "whatsapp://"; }
            else if (m.includes("tiktok")) { window.location.href = "snssdk1233://"; }
            // --- FUN & STORIES ---
            else if (m.includes("joke") || m.includes("funny")) { speak(funny[Math.floor(Math.random()*funny.length)]); }
            else if (m.includes("story")) { speak(stories[Math.floor(Math.random()*stories.length)]); }
            else if (m.includes("ask me")) { speak(questions[Math.floor(Math.random()*questions.length)]); waitingAnswer = true; }
            else if (m.includes("sleep")) { 
                awake = false; document.getElementById('reactor').classList.remove('active', 'camera-on');
                document.getElementById('status').innerText = "VEE: STANDBY";
                speak("Powering down, Boss.");
            }
        };

        rec.onend = () => rec.start();
        document.getElementById('btn').onclick = () => { 
            rec.start(); document.getElementById('btn').style.display='none'; 
            document.getElementById('status').innerText = "VEE: STANDBY";
            speak("Core Initialized. Ready for the Architect.");
        };
    </script>
</body>
</html>
