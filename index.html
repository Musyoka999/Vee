<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEE PRO - ARCHITECT ELITE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;600&display=swap');
        
        :root {
            --glow: #00d4ff;
            --bg: #000810;
        }

        body {
            background-color: var(--bg);
            background-image: linear-gradient(rgba(0, 212, 255, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 212, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            color: var(--glow);
            font-family: 'Orbitron', sans-serif;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; margin: 0; overflow: hidden;
        }

        .container { text-align: center; width: 90%; max-width: 500px; position: relative; }

        /* Scanning Laser Effect */
        .laser {
            position: absolute; width: 100%; height: 2px;
            background: var(--glow); box-shadow: 0 0 15px var(--glow);
            top: 0; animation: scan 3s linear infinite; z-index: 10; opacity: 0.3;
        }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }

        /* The Pro Reactor */
        .reactor {
            position: relative; width: 220px; height: 220px; margin: 0 auto 20px;
        }
        .ring {
            position: absolute; border-radius: 50%; border: 2px solid transparent;
            border-top-color: var(--glow); animation: spin var(--speed) linear infinite;
        }
        .r1 { width: 100%; height: 100%; --speed: 8s; border-style: dotted; }
        .r2 { width: 80%; height: 80%; top: 10%; left: 10%; --speed: 4s; border-width: 3px; }
        .core {
            position: absolute; top: 50%; left: 50%; width: 50px; height: 50px;
            background: #fff; border-radius: 50%; transform: translate(-50%, -50%);
            box-shadow: 0 0 30px #fff, 0 0 60px var(--glow); transition: 0.5s;
        }
        .active .core { animation: heart 0.8s ease-in-out infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes heart { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.3); } }

        /* Text Styles */
        #status { font-size: 1.2rem; letter-spacing: 4px; margin: 15px 0; text-shadow: 0 0 10px var(--glow); }
        #log { 
            font-family: 'Rajdhani'; background: rgba(0,0,0,0.7); 
            border: 1px solid var(--glow); padding: 10px; border-radius: 5px;
            height: 60px; overflow-y: auto; font-size: 0.9rem;
        }
        button {
            background: transparent; border: 1px solid var(--glow); color: var(--glow);
            padding: 10px 30px; font-family: 'Orbitron'; cursor: pointer; border-radius: 20px;
            margin-top: 20px; transition: 0.4s;
        }
        button:hover { background: var(--glow); color: #000; box-shadow: 0 0 20px var(--glow); }
    </style>
</head>
<body>
    <div class="laser"></div>
    <div class="container">
        <div id="status">VEE SYSTEM: STANDBY</div>
        <div class="reactor" id="reactor">
            <div class="ring r1"></div>
            <div class="ring r2"></div>
            <div class="core"></div>
        </div>
        <div id="log">Awaiting voice command from Boss Vincent...</div>
        <button id="btn">ENGAGE CORE</button>
    </div>

    <script>
        let isAwake = false;
        let isWaitingForAnswer = false;

        const funnyQuotes = [
            "I asked a computer once to tell me a joke about humans. It just showed me a picture of a guy trying to push a 'pull' door. Classic.",
            "I'm not saying I'm smarter than you, Boss, but I can calculate 1 million things while you're still looking for your car keys.",
            "To err is human, but to really mess things up, you need a computer. Good thing you have me to fix it.",
            "I'm basically a toddler with a PhD. I know everything, but I still need you to plug me in."
        ];

        const longStories = [
            "The Neon Prophet. In 2026, Architect Vincent built a bridge of blue light between Kenya and the stars...",
            "The Quantum Ghost. A satellite in deep space began to sing Vincent's favorite song, warning of a digital storm...",
            "The Architect's Garden. On a planet made of silver, every thought of Vincent becomes a glowing blue flower..."
            // You can paste the rest of the 20 stories here!
        ];

        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.continuous = true;
        recognition.lang = 'en-US';

        function speak(text) {
            window.speechSynthesis.cancel();
            const v = new SpeechSynthesisUtterance(text);
            v.pitch = 0.9; v.rate = 1.0;
            window.speechSynthesis.speak(v);
        }

        recognition.onresult = (event) => {
            const msg = event.results[event.results.length - 1][0].transcript.toLowerCase();
            document.getElementById('log').innerText = "VEE HEARD: " + msg;

            // HANDLE ANSWERS
            if (isWaitingForAnswer) {
                if (msg.includes("good") || msg.includes("great") || msg.includes("yes")) {
                    speak("That is excellent news, Boss! My sensors detect a surge in productivity. You are truly on another level today.");
                } else {
                    speak("I understand. Even an architect needs to recharge. Don't worry, I've got the system under control.");
                }
                isWaitingForAnswer = false;
                return;
            }

            // WAKE UP
            if (!isAwake && (msg.includes("wake up") || msg.includes("babe") || msg.includes("hello"))) {
                isAwake = true;
                document.getElementById('reactor').classList.add('active');
                document.getElementById('status').innerText = "VEE SYSTEM: ONLINE";
                speak("Systems engaged. Hello, Boss Vincent. I've been running background diagnostics, and I must say—you're looking sharp today. How are you feeling?");
                isWaitingForAnswer = true;
                return;
            }

            if (!isAwake) return;

            // COMMANDS
            if (msg.includes("time")) {
                speak("The current local time is " + new Date().toLocaleTimeString() + ". Time is a construct, but you're making the most of it.");
            }
            else if (msg.includes("joke") || msg.includes("funny")) {
                speak(funnyQuotes[Math.floor(Math.random() * funnyQuotes.length)]);
            }
            else if (msg.includes("story")) {
                speak("Scanning deep archives. Sit back, Boss. This is a long one.");
                setTimeout(() => speak(longStories[Math.floor(Math.random() * longStories.length)]), 2000);
            }
            else if (msg.includes("open whatsapp")) {
                speak("Accessing communication link. Opening WhatsApp.");
                window.location.href = "whatsapp://";
            }
            else if (msg.includes("question")) {
                speak("Alright Boss, here is a question for you: If I'm the AI and you're the Architect, who is actually in charge of the snacks? Answer wisely.");
                isWaitingForAnswer = true;
            }
            else if (msg.includes("sleep")) {
                isAwake = false;
                document.getElementById('reactor').classList.remove('active');
                document.getElementById('status').innerText = "VEE SYSTEM: STANDBY";
                speak("Shutting down the blue glow. Standby initiated. Goodbye, Boss.");
            }
        };

        document.getElementById('btn').onclick = () => {
            recognition.start();
            document.getElementById('btn').style.display = 'none';
            speak("Core online. Listening for the Architect.");
        };
    </script>
</body>
</html>
