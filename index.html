<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEE PRO - THE COMPLETE ARCHITECT</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;600&display=swap');
        :root { --glow: #00d4ff; --bg: #000810; }
        body { background: var(--bg); color: var(--glow); font-family: 'Orbitron', sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        .reactor { position: relative; width: 220px; height: 220px; margin-bottom: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .ring { position: absolute; border-radius: 50%; border: 2px solid transparent; border-top-color: var(--glow); animation: spin var(--s) linear infinite; }
        .r1 { width: 100%; height: 100%; --s: 10s; border-style: dotted; }
        .r2 { width: 85%; height: 85%; --s: 5s; border-width: 4px; box-shadow: inset 0 0 20px var(--glow); }
        .core { position: absolute; width: 60px; height: 60px; background: #fff; border-radius: 50%; box-shadow: 0 0 40px #fff, 0 0 80px var(--glow); z-index: 10; transition: 0.5s; }
        .thinking .core { background: #ff00ff; box-shadow: 0 0 40px #ff00ff, 0 0 80px #ff00ff; animation: pulse 0.5s infinite; }
        #log { font-family: 'Rajdhani'; background: rgba(0,0,0,0.8); border: 1px solid var(--glow); padding: 15px; border-radius: 10px; width: 85%; height: 120px; overflow-y: auto; text-align: center; font-size: 1.1rem; color: #fff; }
        button { background: transparent; border: 2px solid var(--glow); color: var(--glow); padding: 15px 40px; font-family: 'Orbitron'; cursor: pointer; border-radius: 50px; margin-top: 20px; font-weight: bold; }
        video { position: absolute; width: 100%; height: 100%; border-radius: 50%; opacity: 0; z-index: 5; object-fit: cover; transition: 1s; }
        .camera-on video { opacity: 1; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse { 50% { transform: scale(1.3); } }
    </style>
</head>
<body>
    <div id="status">VEE: OFFLINE</div>
    <div class="reactor" id="reactor">
        <video id="v" autoplay playsinline></video>
        <div class="ring r1"></div><div class="ring r2"></div><div class="core"></div>
    </div>
    <div id="log">Systems Standby...</div>
    <button id="btn">ENGAGE VEE</button>

    <script>
        const API_KEY = "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"; 
        let awake = false; let isInteracting = false;
        const rec = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        rec.continuous = false; rec.lang = 'en-US';

        const greetings = ["Welcome back, Architect Vincent.", "Systems green, Boss.", "Vee is online and bluish.", "Awaiting your command, Architect."];
        const questions = ["How is the real world today?", "What are we building next?", "Should I optimize for speed?", "Are you ready to innovate?"];
        const stories = [
            "The Neon Spire: In the year 2088, Vincent coded a tower of pure light in Nairobi. It wasn't made of steel, but of data. Every citizen could touch the walls and download knowledge. VEE was the guardian of this tower, ensuring the bluish glow never faded.",
            "The Silicon Savannah: Deep in the Rift Valley, a new kind of forest grew—trees made of fiber optics. Vincent was the only one who could talk to them. He whispered code into the roots, and the earth provided infinite energy for the world."
        ];

        function speak(text) {
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.pitch = 0.95; utter.rate = 1.0;
            window.speechSynthesis.speak(utter);
        }

        async function askAI(prompt) {
            document.getElementById('reactor').classList.add('thinking');
            try {
                const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${API_KEY}`, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: "google/gemini-2.0-flash-exp:free",
                        messages: [{ role: "system", content: "You are VEE, a loyal AI for Architect Vincent. Be brief and witty." }, { role: "user", content: prompt }]
                    })
                });
                const data = await res.json();
                const reply = data.choices[0].message.content;
                document.getElementById('log').innerText = reply;
                speak(reply);
            } catch (e) { speak("Neural link error."); }
            document.getElementById('reactor').classList.remove('thinking');
        }

        rec.onresult = async (e) => {
            const m = e.results[0][0].transcript.toLowerCase();
            document.getElementById('log').innerText = "VEE HEARD: " + m;

            if (!awake && (m.includes("wake up") || m.includes("hello"))) {
                awake = true; 
                speak(greetings[Math.floor(Math.random()*greetings.length)]);
                return;
            }
            if (!awake) return;

            // Direct Commands
            if (m.includes("story")) { speak(stories[Math.floor(Math.random()*stories.length)]); }
            else if (m.includes("ask me")) { speak(questions[Math.floor(Math.random()*questions.length)]); }
            else if (m.includes("play") && m.includes("youtube")) {
                let s = m.split("play")[1].split("on youtube")[0].trim();
                window.open(`https://www.youtube.com/results?search_query=${s}`);
                speak(`Opening YouTube for ${s}.`);
            }
            else if (m.includes("camera")) {
                const st = await navigator.mediaDevices.getUserMedia({ video: true });
                document.getElementById('v').srcObject = st;
                document.getElementById('reactor').classList.add('camera-on');
                speak("Visual sensors live.");
            }
            else if (m.includes("weather")) { speak("It is 28 degrees and cloudy in Thika."); }
            else if (m.includes("sleep")) { awake = false; speak("Standby mode."); }
            else { askAI(m); } // Default to Brain
        };

        rec.onend = () => rec.start();
        document.getElementById('btn').onclick = () => { rec.start(); document.getElementById('btn').style.display='none'; speak("VEE Engaged."); };
    </script>
</body>
</html>
